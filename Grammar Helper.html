<!DOCTYPE html>
<html lang="en" data-theme="clean" data-serif="on">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Refine — Grammar Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --font-ui: "Hanken Grotesk", system-ui, sans-serif;
    --font-display: "Newsreader", Georgia, serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --accent: #1f6feb;
    --on-accent: #ffffff;

    /* clean theme (default) — cool neutral */
    --bg: #f3f6f9;
    --surface: #ffffff;
    --surface-2: #f4f6f9;
    --ink: #151a20;
    --ink-soft: #4c555f;
    --ink-faint: #8a939f;
    --line: #dfe4ea;
    --line-strong: #c9d1da;
    --radius: 10px;
    --radius-sm: 7px;
    --shadow-card: 0 1px 2px rgba(20,30,45,.05), 0 12px 30px -18px rgba(20,30,45,.20);
    --shadow-pop: 0 24px 60px -20px rgba(15,22,33,.38);
    --tile-bg: #f4f6f9;
  }

  html[data-theme="warm"] {
    --bg: #f4e9dd;
    --surface: #fffaf4;
    --surface-2: #fbf1e6;
    --ink: #2c211a;
    --ink-soft: #7a6354;
    --ink-faint: #b69e8a;
    --line: #ecdcca;
    --line-strong: #ddc7af;
    --radius: 20px;
    --radius-sm: 13px;
    --shadow-card: 0 1px 2px rgba(80,50,20,.05), 0 16px 34px -20px rgba(120,70,30,.28);
    --tile-bg: #fbf1e6;
  }

  html[data-theme="bold"] {
    --bg: #f1f0eb;
    --surface: #ffffff;
    --surface-2: #f3f2ed;
    --ink: #0c0c0a;
    --ink-soft: #44423b;
    --ink-faint: #807c70;
    --line: #100f0c;
    --line-strong: #100f0c;
    --radius: 8px;
    --radius-sm: 6px;
    --shadow-card: 4px 4px 0 #100f0c;
    --shadow-pop: 8px 8px 0 #100f0c;
    --tile-bg: #ffffff;
  }

  html[data-theme="dark"] {
    --bg: #131419;
    --surface: #1b1d25;
    --surface-2: #23262f;
    --ink: #eef0f5;
    --ink-soft: #a4aab8;
    --ink-faint: #6b7180;
    --line: #2d313c;
    --line-strong: #3a3f4c;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 18px 40px -22px rgba(0,0,0,.7);
    --shadow-pop: 0 28px 70px -20px rgba(0,0,0,.8);
    --tile-bg: #23262f;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  html[data-serif="on"] .gh-wordmark,
  html[data-serif="on"] .gh-h2,
  html[data-serif="on"] .gh-output { font-family: var(--font-display); }

  .gh-app {
    min-height: 100vh;
    height: 100dvh;
    max-width: 1180px;
    margin: 0 auto;
    padding: 26px clamp(18px, 4vw, 48px) 56px;
    display: flex;
    flex-direction: column;
  }

  /* ---------- top bar ---------- */
  .gh-topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding-bottom: 22px; margin-bottom: 26px;
    border-bottom: 1px solid var(--line);
  }
  .gh-brand { display: flex; align-items: center; gap: 12px; }
  .gh-logo {
    color: var(--accent); display: inline-flex; align-self: center;
    width: 38px; height: 38px; align-items: center; justify-content: center;
    border: 1.5px solid var(--line-strong); border-radius: 11px; background: var(--surface);
  }
  html[data-theme="bold"] .gh-logo { border-color: var(--ink); }
  .gh-wordmark { font-size: 28px; font-weight: 600; letter-spacing: -.01em; line-height: 1; }
  .gh-tagline { font-size: 14px; color: var(--ink-faint); letter-spacing: .01em; white-space: nowrap; }
  @media (max-width: 560px){ .gh-tagline { display: none; } }

  .gh-keybtn {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--font-ui); font-size: 15px; font-weight: 500; color: var(--ink-soft);
    background: var(--surface); border: 1px solid var(--line-strong);
    padding: 9px 15px; border-radius: 999px; cursor: pointer; transition: .15s; white-space: nowrap;
  }
  .gh-keybtn:hover { border-color: var(--accent); color: var(--ink); }
  .gh-keydot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); }
  .gh-keydot.on { background: #1fa855; box-shadow: 0 0 0 3px rgba(31,168,85,.18); }

  /* ---------- layout ---------- */
  .gh-main { display: flex; flex-direction: column; gap: 22px; flex: 1; min-height: 0; }
  .gh-panes { display: grid; gap: 20px; align-items: stretch; position: relative; flex: 1; min-height: 0; }
  .gh-layout-split .gh-panes { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
  .gh-layout-stacked .gh-panes { grid-template-columns: minmax(0,1fr); }
  .gh-layout-stacked .gh-main { max-width: 760px; width: 100%; margin: 0 auto; }
  @media (max-width: 760px){ .gh-layout-split .gh-panes { grid-template-columns: minmax(0,1fr); } }

  .gh-panes > .gh-compose, .gh-panes > .gh-result { min-height: 320px; height: 100%; }
  .gh-compose { display: flex; flex-direction: column; }
  .gh-compose .gh-textarea { flex: 1; min-height: 0; }

  /* ---------- rewrite button (below draft) ---------- */
  .gh-go {
    align-self: flex-end; margin-top: 14px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--font-ui); font-weight: 600; font-size: 15px; letter-spacing: -.005em;
    background: var(--accent); color: var(--on-accent); border: none;
    padding: 11px 20px; border-radius: 999px;
    box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--accent) 60%, transparent);
    transition: transform .12s, filter .15s, box-shadow .15s;
  }
  html[data-theme="bold"] .gh-go { border-radius: var(--radius-sm); border: 1.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .gh-go:hover:not(:disabled) { filter: brightness(1.07); }
  html[data-theme="bold"] .gh-go:hover:not(:disabled) { filter: none; transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  .gh-go:active:not(:disabled) { transform: translateY(1px); }
  .gh-go:disabled { cursor: not-allowed; background: color-mix(in srgb, var(--accent) 38%, var(--surface-2)); box-shadow: none; }
  .gh-go-ico { display: inline-flex; }
  .gh-go-label { white-space: nowrap; }
  .gh-go-spin {
    width: 17px; height: 17px; border-radius: 50%;
    border: 2.5px solid color-mix(in srgb, var(--on-accent) 35%, transparent);
    border-top-color: var(--on-accent); animation: ghspin .7s linear infinite;
  }
  @keyframes ghspin { to { transform: rotate(360deg); } }

  /* ---------- controls toolbar ---------- */
  .gh-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .gh-keylink {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-ui); font-size: 14px; font-weight: 500; color: var(--ink-faint);
    background: none; border: none; padding: 6px 4px; cursor: pointer; transition: color .15s; white-space: nowrap;
  }
  .gh-keylink:hover { color: var(--ink); }
  .gh-keydot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); flex: 0 0 auto; }
  .gh-keydot.on { background: #1fa855; box-shadow: 0 0 0 3px rgba(31,168,85,.18); }

  /* ---------- shared bits ---------- */
  .gh-eyebrow {
    font-size: 12.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .gh-eyebrow-block { display: block; margin-bottom: 11px; }
  .gh-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-card);
  }
  html[data-theme="bold"] .gh-card { border: 1.5px solid var(--ink); }

  /* ---------- compose ---------- */
  .gh-compose { padding: 18px 18px 14px; }
  .gh-textarea {
    width: 100%; min-height: 168px; resize: none;
    border: none; outline: none; background: transparent;
    font-family: var(--font-ui); font-size: 17px; line-height: 1.6; color: var(--ink);
    padding: 2px 0;
  }
  .gh-textarea::placeholder { color: var(--ink-faint); }
  .gh-compose-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; padding-top: 11px; border-top: 1px solid var(--line);
  }
  .gh-count { font-size: 13.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .gh-clear {
    border: none; background: none; cursor: pointer; font-family: var(--font-ui);
    font-size: 13.5px; color: var(--ink-soft); padding: 2px 4px; border-radius: 6px;
  }
  .gh-clear:hover { color: var(--ink); text-decoration: underline; }

  /* ---------- top control row ---------- */
  .gh-topcontrols {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap;
  }

  /* ---------- tabs ---------- */
  .gh-tabsrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .gh-tabs { display: flex; gap: 18px; }
  .gh-gear {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
    color: var(--ink-faint); background: none; border: none; opacity: .55;
    transition: .15s;
  }
  .gh-gear svg { width: 16px; height: 16px; }
  .gh-gear:hover { color: var(--ink-soft); opacity: 1; }
  .gh-gear:active { transform: translateY(1px); }
  .gh-tab {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-ui); font-size: 15px; font-weight: 600; color: var(--ink-faint);
    background: none; border: none; cursor: pointer;
    padding: 9px 4px 12px; position: relative; transition: color .15s;
  }
  .gh-tab svg { opacity: .8; }
  .gh-tab:hover { color: var(--ink-soft); }
  .gh-tab.is-active { color: var(--ink); }
  .gh-tab.is-active::after {
    content: ""; position: absolute; left: 4px; right: 4px; bottom: -1px; height: 2px;
    background: var(--accent); border-radius: 2px;
  }

  /* ---------- reply fields ---------- */
  .gh-compose-reply { display: flex; flex-direction: column; padding: 16px 18px; }
  .gh-field { display: flex; flex-direction: column; flex: 1 1 0; min-height: 100px; }
  .gh-field-tag {
    font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 7px;
  }
  .gh-textarea-sm { font-size: 15px; min-height: 80px; flex: 1; }
  .gh-field-rule { height: 1px; background: var(--line); margin: 14px 0; flex: 0 0 auto; }

  /* ---------- channel chips ---------- */
  .gh-tiles { display: flex; flex-wrap: wrap; gap: 7px; }
  .gh-chip {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--tile-bg); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
    font-family: var(--font-ui); font-size: 13.5px; font-weight: 500; color: var(--ink-soft);
    white-space: nowrap; transition: border-color .15s, background .15s, color .15s, transform .08s;
  }
  html[data-theme="bold"] .gh-chip { border-radius: var(--radius-sm); }
  .gh-chip:hover { border-color: var(--line-strong); color: var(--ink); }
  .gh-chip:active { transform: translateY(1px); }
  .gh-chip.is-active {
    color: var(--ink); font-weight: 600;
    border-color: color-mix(in srgb, var(--tile-hue, var(--accent)) 42%, var(--line-strong));
    background: color-mix(in srgb, var(--tile-hue, var(--accent)) 6%, var(--surface));
  }
  html[data-theme="dark"] .gh-chip.is-active { background: color-mix(in srgb, var(--tile-hue, var(--accent)) 20%, var(--surface)); }
  .gh-chip-ico { color: var(--ink-faint); display: inline-flex; flex: 0 0 auto; transition: color .15s; }
  .gh-chip-label { letter-spacing: -.005em; }

  /* ---------- controls ---------- */
  .gh-control { flex: 1 1 auto; min-width: 0; }
  .gh-control-model { flex: 1 1 220px; max-width: 320px; }

  .gh-segmented {
    display: inline-flex; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 0; gap: 0; overflow: hidden;
  }
  .gh-segmented-tone { flex: 0 0 auto; }
  .gh-seg {
    border: none; background: none; cursor: pointer; font-family: var(--font-ui);
    font-size: 13.5px; font-weight: 500; color: var(--ink-soft);
    padding: 7px 16px; border-radius: 999px; transition: .14s; white-space: nowrap;
  }
  .gh-seg:hover { color: var(--ink); }
  .gh-seg.is-active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); }
  html[data-theme="dark"] .gh-seg.is-active { background: var(--line-strong); }
  html[data-theme="bold"] .gh-seg.is-active { background: var(--ink); color: var(--surface); box-shadow: none; }

  .gh-select-wrap { position: relative; }
  .gh-select {
    appearance: none; -webkit-appearance: none; width: 100%;
    font-family: var(--font-ui); font-size: 15px; font-weight: 500; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 38px 9px 16px; cursor: pointer;
  }
  .gh-select:focus { outline: none; border-color: var(--accent); }
  .gh-select-caret { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; }

  /* ---------- primary button ---------- */
  .gh-primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    font-family: var(--font-ui); font-weight: 600; font-size: 16.5px; letter-spacing: -.005em;
    color: var(--on-accent); background: var(--accent); border: none;
    border-radius: 999px; padding: 14px 22px; cursor: pointer; transition: filter .15s, transform .08s, box-shadow .15s; white-space: nowrap;
  }
  html[data-theme="bold"] .gh-primary { border-radius: var(--radius-sm); border: 1.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .gh-primary:hover:not(:disabled) { filter: brightness(1.07); }
  html[data-theme="bold"] .gh-primary:hover:not(:disabled) { filter: none; transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  .gh-primary:active:not(:disabled) { transform: translateY(1px); }
  .gh-primary:disabled { opacity: .42; cursor: not-allowed; }
  .gh-send { padding: 12px 30px; }
  .gh-primary-sm { padding: 10px 18px; font-size: 15px; }
  .gh-hint { display: block; text-align: center; margin-top: 9px; font-size: 12.5px; color: var(--ink-faint); }

  /* ---------- result ---------- */
  .gh-result {
    position: relative;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; min-height: 320px; overflow: hidden;
  }
  html[data-theme="bold"] .gh-result { border: 1.5px solid var(--ink); }
  .gh-result-head {
    display: flex; align-items: center; justify-content: flex-end;
    padding: 12px 14px; border-bottom: 1px solid var(--line); min-height: 50px;
  }
  .gh-copybtn {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
    background: color-mix(in srgb, var(--surface) 86%, transparent);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    border: 1px solid var(--line-strong);
    width: 34px; height: 34px; border-radius: 7px; cursor: pointer; transition: .15s;
  }
  .gh-copybtn:hover { border-color: var(--accent); color: var(--accent); }
  .gh-copybtn:disabled { opacity: .4; cursor: not-allowed; }
  .gh-copybtn:disabled:hover { border-color: var(--line-strong); color: var(--ink-soft); }
  .gh-copybtn.is-copied { color: #1fa855; border-color: #1fa855; background: color-mix(in srgb, #1fa855 8%, var(--surface)); }
  .gh-result-body { flex: 1; padding: 22px; display: flex; }
  .gh-output {
    font-size: 15px; line-height: 1.65; color: var(--ink);
    white-space: pre-wrap; word-break: break-word; width: 100%;
  }

  .gh-placeholder {
    margin: auto; text-align: center; color: var(--ink-faint); max-width: 280px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .gh-placeholder-mark {
    width: 60px; height: 60px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint); background: var(--surface-2); border: 1px dashed var(--line-strong);
  }
  .gh-placeholder p { margin: 0; font-size: 14px; line-height: 1.5; }

  .gh-loading { margin: auto; display: flex; align-items: center; gap: 9px; color: var(--ink-soft); }
  .gh-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: ghpulse 1.1s infinite ease-in-out; }
  .gh-dot:nth-child(2){ animation-delay: .18s; } .gh-dot:nth-child(3){ animation-delay: .36s; }
  .gh-loading-text { font-size: 15px; margin-left: 4px; }
  @keyframes ghpulse { 0%,100%{ opacity:.25; transform: translateY(0);} 50%{ opacity:1; transform: translateY(-4px);} }

  .gh-error { margin: auto; text-align: center; max-width: 340px; display: flex; flex-direction: column; gap: 8px; }
  .gh-error strong { color: var(--ink); font-size: 16px; }
  .gh-error span { color: var(--ink-soft); font-size: 15px; line-height: 1.5; }

  /* ---------- modal ---------- */
  .gh-modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,30,45,.18); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
    animation: ghfade .15s ease;
  }
  @keyframes ghfade { from { opacity: 0; } }
  .gh-modal {
    width: 100%; max-width: 460px; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-pop);
    padding: 22px 22px 20px;
  }
  .gh-modal-head { display: flex; align-items: center; justify-content: space-between; }
  .gh-h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .gh-modal-sub { margin: 8px 0 18px; font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); }
  .gh-field-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  .gh-field-label:not(:first-child) { margin-top: 16px; }
  .gh-field-help { margin: 6px 0 0; font-size: 12px; color: var(--ink-faint); line-height: 1.5; }
  .gh-input-area { width: 100%; min-height: 76px; resize: vertical; line-height: 1.5; font-family: var(--font-ui); }
  .gh-quickpicks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .gh-quickpick {
    font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; color: var(--ink-soft);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px; cursor: pointer; transition: .14s;
  }
  .gh-quickpick:hover { border-color: var(--line-strong); color: var(--ink); }
  .gh-quickpick.is-active { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 45%, var(--line-strong)); color: var(--ink); }
  .gh-settings-rule { height: 1px; background: var(--line); margin: 20px 0 4px; }
  .gh-modal-lg { max-width: 500px; display: flex; flex-direction: column; max-height: min(86vh, 720px); }
  .gh-modal-scroll { overflow-y: auto; margin: 4px -4px 0; padding: 4px 4px 0; }
  .gh-conn { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-faint); }
  .gh-keyrow { display: flex; gap: 8px; }
  .gh-input {
    flex: 1; font-family: var(--font-ui); font-size: 14px; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm); padding: 9px 12px; outline: none;
  }
  .gh-input:focus { border-color: var(--accent); }
  .gh-mono { font-family: var(--font-mono); font-size: 14px; letter-spacing: -.01em; }
  .gh-ghostbtn {
    font-family: var(--font-ui); font-size: 14px; font-weight: 500; color: var(--ink-soft);
    background: var(--surface-2); border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm); padding: 0 14px; cursor: pointer;
  }
  .gh-ghostbtn:hover { color: var(--ink); border-color: var(--accent); }
  .gh-modal-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
  .gh-foot-actions { display: flex; gap: 8px; }
  .gh-link { font-size: 14px; color: var(--accent); text-decoration: none; font-weight: 500; }
  .gh-link:hover { text-decoration: underline; }
  .gh-iconbtn { border: none; background: none; color: var(--ink-faint); cursor: pointer; padding: 4px; border-radius: 8px; display: inline-flex; }
  .gh-iconbtn:hover { color: var(--ink); background: var(--surface-2); }

  .gh-block { display: flex; flex-direction: column; }
